<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | دانش‌یار</title><link rel="stylesheet" href="assets/style.css"></head><body>
<nav class="nav"><div class="container nav-in"><a class="brand" href="index.html"><span class="logo">★</span> دانش‌یار</a><div class="navlinks"><a href="index.html">خانه</a><a href="#upload">آپلود</a><a href="#files">فایل‌ها</a></div></div></nav>
<main class="section"><div class="container">
<div class="page-head-box science-head" style="margin-bottom:18px"><div><h1>پنل مدیریت 🛠️</h1><p>عکس و PDF را برای هر درس آپلود و مدیریت کن.</p></div><div style="font-size:52px">📁</div></div>
<div id="loginBox" class="q"><h3>ورود مدیر</h3><p style="color:#71809b;font-size:12px">برای دسترسی به آپلود فایل، رمز مدیریت را وارد کن.</p><form id="loginForm" class="toolbar"><input id="password" class="search" type="password" placeholder="رمز مدیریت"><button class="filter active" type="submit">ورود</button></form><div id="loginMsg" class="answer" hidden></div></div>
<div id="panel" hidden>
<section id="upload" class="q" style="margin-bottom:16px"><div class="q-top"><h3>➕ افزودن فایل جدید</h3><span class="tag">تصویر یا PDF</span></div>
<form id="uploadForm" style="margin-top:14px"><div class="toolbar"><select id="subject" class="filter" style="border:1px solid #e7ebf2"><option value="science">علوم</option><option value="farsi">فارسی</option><option value="social">مطالعات اجتماعی</option><option value="gift">هدیه آسمانی</option></select><input id="file" class="search" type="file" accept="image/*,.pdf" required><button class="filter active" type="submit">آپلود فایل ⬆️</button></div><div id="uploadMsg" class="answer" hidden></div></form></section>
<section id="files"><div class="section-title"><div><h2>فایل‌های آپلودشده</h2><p>فایل‌های هر چهار درس را اینجا می‌بینی.</p></div></div><div id="fileList" class="questions"></div></section>
<button id="logout" class="filter" style="margin-top:18px">خروج از پنل</button>
</div></div></main><footer class="footer">دانش‌یار • پنل مدیریت</footer>
<script>
const $=s=>document.querySelector(s);const names={science:'علوم',farsi:'فارسی',social:'مطالعات اجتماعی',gift:'هدیه آسمانی'};
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'خطایی رخ داد');return d}
async function refresh(){const d=await api('/api/files');const list=$('#fileList');if(!d.files.length){list.innerHTML='<div class="empty">هنوز فایلی آپلود نشده است.</div>';return}list.innerHTML=d.files.map(f=>`<article class="q"><div class="q-top"><div><h3>${escapeHtml(f.key.split('/').pop())}</h3><span class="tag">${escapeHtml(names[f.key.split('/')[1]]||'')}</span></div><button class="filter" data-del="${encodeURIComponent(f.key)}">حذف 🗑️</button></div><p style="color:#7b8798;font-size:11px;margin:9px 0">حجم: ${Math.round(f.size/1024)} KB</p><a class="filter active" href="${f.url}" target="_blank">مشاهده فایل ↗</a></article>`).join('');list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('این فایل حذف شود؟')){await api('/api/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:decodeURIComponent(b.dataset.del)})});refresh()}})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function init(){try{const m=await api('/api/me');if(m.authenticated){$('#loginBox').hidden=true;$('#panel').hidden=false;refresh()}}catch(e){}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').hidden=false;try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});$('#loginBox').hidden=true;$('#panel').hidden=false;refresh()}catch(err){$('#loginMsg').textContent=err.message;$('#loginMsg').style.color='#c75c4d'}};
$('#uploadForm').onsubmit=async e=>{e.preventDefault();const f=$('#file').files[0];if(!f)return;const fd=new FormData();fd.append('subject',$('#subject').value);fd.append('file',f);$('#uploadMsg').hidden=false;$('#uploadMsg').textContent='در حال آپلود...';try{await api('/api/upload',{method:'POST',body:fd});$('#uploadMsg').textContent='فایل با موفقیت آپلود شد. 🎉';$('#file').value='';refresh()}catch(err){$('#uploadMsg').textContent=err.message;$('#uploadMsg').style.color='#c75c4d'}};
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};init();
</script></body></html>
